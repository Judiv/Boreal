services:
  # --- BASE DE DONNÉES ---
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin_boreal
      POSTGRES_PASSWORD: password_secret
      POSTGRES_DB: boreal_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_boreal -d boreal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- IA CHAT BOT ---
  ollama:
    image: ollama/ollama:latest
    container_name: boreal-ollama
    restart: always
    volumes:
      - ollama_storage:/root/.ollama

  # --- APPLICATION BOREAL ---
  app:
    build: .
    user: "root"
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Connexion DB interne au réseau Docker
      DATABASE_URL: "postgresql://admin_boreal:password_secret@db:5432/boreal_db?schema=public"
      NODE_ENV: production
      
      # Mapping des variables Email (OVH)
      EMAIL_SERVER_HOST: ${EMAIL_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_PORT}
      EMAIL_SERVER_USER: ${EMAIL_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_USER}

      # Mapping Pusher (Correction des clés)
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER}
      
      # Configuration URL
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}

      # Modèle LLM
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
  ollama_storage: